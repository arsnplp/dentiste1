# nginx — dentiste1.nairox.fr (site statique)
# Installe dans /etc/nginx/sites-available/dentiste1.nairox.fr
# certbot ajoute ensuite automatiquement le bloc HTTPS (443) et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name dentiste1.nairox.fr;

    root /var/www/dentiste1;
    index index.html;
    charset utf-8;

    # Pre-production : pas d'indexation Google sur ce sous-domaine
    # (evite le contenu duplique avec le futur vrai domaine). A retirer en prod.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Securite de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ne jamais servir le depot git ni les fichiers de deploiement
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }

    # URLs propres : /blog -> blog.html, /soins/detartrage -> soins/detartrage.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets : cache 30 jours (expires ne supprime pas les en-tetes ci-dessus)
    location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # HTML : toujours revalide, les mises a jour apparaissent immediatement
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/dentiste1.access.log;
    error_log  /var/log/nginx/dentiste1.error.log;
}
